      "detail": "Seasonal periods were hardcoded per sampling frequency, assuming every hourly case carries 24h/168h cycles and every daily case 7d/365d — wrong for much of the environmental half of the benchmark (waves and de-tided surge have no diurnal cycle; rivers have no work week) and consequential, since that map also set the MASE denominator, distorting cross-case MASE comparisons. Each case now declares `seasonalities` in its case.toml — required, dominant-first, `[]` meaning explicitly non-seasonal — as the single source of truth for SeasonalNaive, TBATS, AutoTheta, MSTL, and the ML feature pipeline; the old frequency maps were deleted with no fallback.\n\nCandidates come from a fixed physically-motivated menu per frequency and are accepted only with ≥2 full train-split cycles, a periodogram peak exceeding 10× the surrounding octave band's median power, and ACF ≥ 0.1 at that lag. Two upstream assumptions didn't survive: hourly cases are mostly tidal (12h), not diurnal, and one daily case (`discharge_flashy_catskills`) is genuinely non-seasonal. New cases must declare `seasonalities` (schema-enforced), and MASE values shift on any case where the declared dominant period differs from the old frequency default.",

      "detail": "Missing target data was handled in two places — the eval loop imputed gaps on the fly (linear interpolation then mean-fill), and several methods also interpolated or dropped NaNs internally, inconsistently. Worse, mean-fill let models train on large fabricated stretches — one 6574-step block was 54% of `discharge_lowland_denmark`, a single interpolated straight line.\n\nReplaced both layers with one materialized policy in `data/curate.py`: gaps are interpolatable only up to a per-case cap (the lag at which the target's ACF first drops below 0.8, bounded by one seasonal cycle), gaps larger than the cap are treated as hard boundaries, and only the longest contiguous segment is kept — chosen over most-recent because a big gap near `waves_massachusetts`'s train/test boundary would have starved it to 5 training points. A `y_observed` mask on the curated data tracks which points were genuinely measured, so metrics and origin selection never score a filled point as real. `scripts/curate_data.py` writes `data/curated/<case>.parquet` once; re-run it after any data refresh or a change to the ACF threshold.",

      "detail": "Reviewed all method wrappers (`naive.py`, `classical.py`, `ml.py`, `dl.py`, `fm.py`, `nf_models.py`, `torchdl.py`) and how the eval loops call them, recording findings to prioritize rather than fixing them immediately. Biggest validity concern: classical methods ran non-seasonal by default while ML methods got seasonal features; also flagged were asymmetric training budgets between statsforecast's auto-selection and the neural methods' fixed tiny step counts, unscaled MLP features, and Chronos scoring its median against a mean-optimal metric.\n\nCorrectness issues found: `_complete_for_fit` ran on the full train+test frame before slicing, leaking test-period information into training gap-fills; DLinear/N-HiTS/PatchTST silently fell back to persistence on short series while reporting status \"ok\"; and several frequency-dispatch tables only handled {daily, hourly, 15-min, weekly} with silent generic defaults otherwise. Design risks noted: `predict(history=...)` is dead in every non-naive method, and the exogenous tier conflated historical-only and known-future covariates. Suite gaps flagged included the missing ensemble-of-baselines and MSTL columns, a single foundation model, and a strategy confound between recursive mlforecast methods and direct-multi-output DL methods.",

    "supersedes":    { label: "supersedes",    reverseLabel: "superseded by",    dash: "6,3",  arrow: true },
    "fixes-bug-in":  { label: "fixes bug in",  reverseLabel: "bug fixed by",     dash: "1,3",  arrow: true },
    "depends-on":    { label: "depends on",    reverseLabel: "depended on by",   dash: null,   arrow: true },
    "relates-to":    { label: "relates to",    reverseLabel: "relates to",       dash: null,   arrow: false },
  };

  const root = document.querySelector(".viz-root");
  const rootStyle = getComputedStyle(root);
  function cssVar(name) { return rootStyle.getPropertyValue(name).trim(); }
  function categoryColor(cat) { return cssVar(CATEGORY_META[cat].varName); }

  // --- lightweight markdown-ish renderer: `code`, **bold**, blank-line paragraphs ---
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function renderDetail(text) {
    const paragraphs = text.split(/\n\n+/);
    return paragraphs
      .map((p) => {
        let h = escapeHtml(p);
        h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
        h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        return `<p>${h}</p>`;
      })
      .join("");
  }

  // --- build node/edge working copies (D3 mutates these in place) ---
  const nodeById = new Map(DATA.nodes.map((n) => [n.id, n]));
  const nodes = DATA.nodes.map((n) => ({ ...n, dateObj: new Date(n.date) }));
  const links = DATA.edges.map((e) => ({ ...e }));

  const degree = new Map(nodes.map((n) => [n.id, 0]));
  links.forEach((e) => {
    degree.set(e.source, (degree.get(e.source) || 0) + 1);
    degree.set(e.target, (degree.get(e.target) || 0) + 1);
  });

  const connectionsByNode = new Map(nodes.map((n) => [n.id, []]));
  links.forEach((e) => {
    connectionsByNode.get(e.source).push({ otherId: e.target, type: e.type, direction: "out" });
    connectionsByNode.get(e.target).push({ otherId: e.source, type: e.type, direction: "in" });
  });

  const svg = d3.select("#graph-svg");
  const tooltip = d3.select("#tooltip");
  const panel = document.getElementById("panel");
  const panelBody = document.getElementById("panel-body");
  const panelClose = document.getElementById("panel-close");

  let width = window.innerWidth;
  let height = window.innerHeight;
  svg.attr("viewBox", [0, 0, width, height]);

  const zoomLayer = svg.append("g").attr("class", "zoom-layer");

  // arrowhead marker (shared, since edge type is encoded by dash pattern, not color)
  const defs = svg.append("defs");
  defs
    .append("marker")
    .attr("id", "arrow")
    .attr("viewBox", "0 -5 10 10")
    .attr("refX", 20)
    .attr("refY", 0)
    .attr("markerWidth", 7)
    .attr("markerHeight", 7)
    .attr("orient", "auto")
    .append("path")
    .attr("d", "M0,-5L10,0L0,5")
    .attr("fill", cssVar("--edge-ink"));

  const linkGroup = zoomLayer.append("g").attr("class", "links");
  const nodeGroup = zoomLayer.append("g").attr("class", "nodes");

  const dateExtent = d3.extent(nodes, (d) => d.dateObj);
  const xForce = d3
    .scaleTime()
    .domain(dateExtent)
    .range([90, Math.max(180, width - 90)]);

  function radiusFor(d) {
    return 7 + Math.min(degree.get(d.id) || 0, 6) * 1.4;
  }

  const simulation = d3
    .forceSimulation(nodes)
    .force(
      "link",
      d3
        .forceLink(links)
        .id((d) => d.id)
        .distance(85)
        .strength(0.35)
    )
    .force("charge", d3.forceManyBody().strength(-230))
    .force("collide", d3.forceCollide().radius((d) => radiusFor(d) + 14))
    .force("x", d3.forceX((d) => xForce(d.dateObj)).strength(0.09))
    .force("y", d3.forceY(() => height / 2).strength(0.03));

  const link = linkGroup
    .selectAll("path")
    .data(links)
    .join("path")
    .attr("class", "link")
    .attr("stroke-width", 1.4)
    .attr("stroke-dasharray", (d) => EDGE_META[d.type].dash)
    .attr("marker-end", (d) => (EDGE_META[d.type].arrow ? "url(#arrow)" : null));

  const node = nodeGroup
    .selectAll("g.node")
    .data(nodes, (d) => d.id)
    .join("g")
    .attr("class", "node");

  node
    .append("circle")
    .attr("r", radiusFor)
    .attr("fill", (d) => categoryColor(d.category));

  node
    .append("text")
    .attr("x", (d) => radiusFor(d) + 4)
    .attr("y", 3)
    .text((d) => (d.title.length > 46 ? d.title.slice(0, 44) + "…" : d.title));

  let selectedId = null;

  node.on("mouseenter", function (event, d) {
    tooltip
      .html(
        `<div class="t-title">${escapeHtml(d.title)}</div>` +
          `<div class="t-meta"><span class="t-dot" style="background:${categoryColor(
            d.category
          )}"></span>${d.date} · ${CATEGORY_META[d.category].label}</div>` +
          `<div class="t-summary">${escapeHtml(d.summary)}</div>`
      )
      .classed("visible", true);
  });
  node.on("mousemove", function (event) {
    const pad = 16;
    let left = event.clientX + pad;
    let top = event.clientY + pad;
    const tw = tooltip.node().offsetWidth;
    const th = tooltip.node().offsetHeight;
    if (left + tw > window.innerWidth - 8) left = event.clientX - tw - pad;
    if (top + th > window.innerHeight - 8) top = event.clientY - th - pad;
    tooltip.style("left", left + "px").style("top", top + "px");
  });
  node.on("mouseleave", function () {
    tooltip.classed("visible", false);
  });

  node.on("click", function (event, d) {
    event.stopPropagation();
    openPanel(d.id);
  });

  function openPanel(id) {
    const d = nodeById.get(id);
    selectedId = id;
    node.select("circle").classed("selected", (n) => n.id === id);

    const conns = connectionsByNode.get(id);
    const connHtml = conns.length
      ? conns
          .map((c) => {
            const other = nodeById.get(c.otherId);
            const relLabel =
              c.direction === "out" ? EDGE_META[c.type].label : EDGE_META[c.type].reverseLabel;
            return `<button class="p-conn" data-target="${c.otherId}">
                <div class="c-rel">${relLabel}</div>
                <div class="c-title">${escapeHtml(other.title)} · ${other.date}</div>
              </button>`;
          })
          .join("")
      : `<div class="p-empty">No recorded connections to other entries.</div>`;

    panelBody.innerHTML = `
      <div class="p-meta">
        <span class="p-dot" style="background:${categoryColor(d.category)}"></span>
        ${d.date} · ${CATEGORY_META[d.category].label}
      </div>
      <h2>${escapeHtml(d.title)}</h2>
      <div class="p-detail">${renderDetail(d.detail)}</div>
      <div class="p-tags">${d.tags.map((t) => `<span class="p-tag">${escapeHtml(t)}</span>`).join("")}</div>
      <div class="p-section-title">Connections</div>
      ${connHtml}
    `;
    panelBody.querySelectorAll(".p-conn").forEach((btn) => {
      btn.addEventListener("click", () => openPanel(btn.dataset.target));
    });

    panel.classList.add("open");
  }

  panelClose.addEventListener("click", () => {
    panel.classList.remove("open");
    selectedId = null;
    node.select("circle").classed("selected", false);
  });
  svg.on("click", () => {
    panel.classList.remove("open");
    selectedId = null;
    node.select("circle").classed("selected", false);
  });

  // --- drag: pin on drag, keep pinned after release, double-click to unpin ---
  function dragstarted(event, d) {
    if (!event.active) simulation.alphaTarget(0.25).restart();
    d.fx = d.x;
    d.fy = d.y;
  }
  function dragged(event, d) {
    d.fx = event.x;
    d.fy = event.y;
  }
  function dragended(event) {
    if (!event.active) simulation.alphaTarget(0);
  }
  node.call(d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended));

  node.on("dblclick", function (event, d) {
    event.stopPropagation();
    d.fx = null;
    d.fy = null;
    simulation.alphaTarget(0.25).restart();
    setTimeout(() => simulation.alphaTarget(0), 200);
  });

  // --- pan / zoom ---
  const zoom = d3
    .zoom()
    .scaleExtent([0.3, 4])
    .on("zoom", (event) => {
      zoomLayer.attr("transform", event.transform);
    });
  svg.call(zoom);

  function linkPath(d) {
    return `M${d.source.x},${d.source.y}L${d.target.x},${d.target.y}`;
  }

  simulation.on("tick", () => {
    link.attr("d", linkPath);
    node.attr("transform", (d) => `translate(${d.x},${d.y})`);
  });

  // --- legend (static color key + edge-type key) ---
  const legend = document.getElementById("legend");
  const catRows = Object.entries(CATEGORY_META)
    .map(
      ([, meta]) =>
        `<div class="row"><span class="swatch" style="background:${cssVar(meta.varName)}"></span>${meta.label}</div>`
    )
    .join("");
  const edgeRows = Object.entries(EDGE_META)
    .map(([, meta]) => {
      const dash = meta.dash ? `stroke-dasharray="${meta.dash}"` : "";
      const marker = meta.arrow ? `marker-end="url(#arrow)"` : "";
      return `<div class="edge-row">
          <svg class="edge-sample" width="28" height="10">
            <line x1="1" y1="5" x2="22" y2="5" stroke="${cssVar("--edge-ink")}" stroke-width="1.4" ${dash} ${marker}></line>
          </svg>
          ${meta.label}
        </div>`;
    })
    .join("");
  legend.innerHTML = catRows + `<div class="edge-key">${edgeRows}</div>`;

  // --- resize handling ---
  window.addEventListener("resize", () => {
    width = window.innerWidth;
    height = window.innerHeight;
    svg.attr("viewBox", [0, 0, width, height]);
    xForce.range([90, Math.max(180, width - 90)]);
    simulation.force("y", d3.forceY(() => height / 2).strength(0.03));
    simulation.alpha(0.3).restart();
  });
})();
</script>
