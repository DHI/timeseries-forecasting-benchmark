name: Pages

# Build and publish the two static sites this repo ships to GitHub Pages, combined into
# one deployment (actions/deploy-pages only publishes one site per repo, so they can't
# each run their own deploy job without clobbering the other):
#   - the React results-matrix app (web/) at the site root
#   - the marimo per-case EDA browser (scripts/build_site.py) at /eda/
# Requires Pages to be enabled with "Source: GitHub Actions" in the repository settings —
# until then this workflow builds but the deploy step is a no-op.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "notebooks/eda.py"
      - "scripts/build_site.py"
      - "scripts/export_web_data.py"
      - ".github/workflows/pages.yml"
      - "src/tsforecastbench/data/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress run mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"

      - name: Sync (notebooks extra → marimo + plotly)
        run: uv sync --extra notebooks

      - name: Build EDA site (-> _site/eda)
        run: uv run python scripts/build_site.py --out _site/eda

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web app dependencies
        working-directory: web
        run: npm ci

      - name: Lint web app
        working-directory: web
        run: npm run lint

      - name: Test web app
        working-directory: web
        run: npm run test -- --run

      - name: Build web app (-> web/dist)
        working-directory: web
        run: npm run build

      - name: Assemble combined site (React at root, EDA under _site/eda already in place)
        run: cp -r web/dist/. _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
