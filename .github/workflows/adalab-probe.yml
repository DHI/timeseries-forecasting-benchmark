name: AdaLab probe

# TEMPORARY — delete before merging. Applies the access_level from .adalab/app.json to
# the live app, which the deploy workflow does not do: dhi_adalab reads access_level
# only when creating an app, so a later edit to app.json never reaches AdaLab.

on:
  push:
    branches: [adalab-deploy]
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, adalab]
    steps:
      - uses: actions/checkout@v4

      - name: Apply access_level and report
        env:
          PAT: ${{ secrets.ADALAB_PAT }}
        run: |
          python3 -m venv /tmp/adaprobe
          /tmp/adaprobe/bin/pip install -q --upgrade pip adalib
          /tmp/adaprobe/bin/python - <<'PY'
          import json, os
          from adalib_auth.config import get_config

          get_config(
              adaboard_api_url="https://adalab.dhigroup.com/adaboard/api",
              token=os.environ["PAT"],
          )
          import adalib.apps as apps

          spec = json.loads(open(".adalab/app.json").read())
          app_id, want = spec["app_id"], spec["access_level"]

          before = apps.get_app(app_id)["acls"]
          print("before:", json.dumps(before))

          if any(a["acl_type"] != want for a in before):
              apps.edit_app(app_id=app_id, acl_type=want, acl_list=[])
              print(f"edit_app -> acl_type={want}")
          else:
              print("already correct, no change")

          print("after: ", json.dumps(apps.get_app(app_id)["acls"]))
          PY
