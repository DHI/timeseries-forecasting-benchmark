name: AdaLab probe

# TEMPORARY — delete before merging. Deploys nothing. Answers the two things that
# cannot be checked from a laptop: whether a [self-hosted, adalab] runner picks up jobs
# from this repository, and whether that runner can reach AdaLab's internal API.

on:
  push:
    branches: [adalab-deploy]
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, adalab]
    steps:
      - name: Runner identity and reachability
        run: |
          echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH"
          curl -s -o /dev/null -w "adaboard api: %{http_code}\n" --max-time 15 \
            https://adalab.dhigroup.com/adaboard/api/ || echo "adaboard: unreachable"
          curl -s -o /dev/null -w "harbor:       %{http_code}\n" --max-time 15 \
            https://harbor.adalab.dhigroup.com/api/v2.0/systeminfo || echo "harbor: unreachable"

      - name: Secret is populated
        env:
          PAT: ${{ secrets.ADALAB_PAT }}
        run: |
          if [ -n "$PAT" ]; then
            echo "ADALAB_PAT is set (${#PAT} characters)"
          else
            echo "ADALAB_PAT is empty"
            exit 1
          fi
