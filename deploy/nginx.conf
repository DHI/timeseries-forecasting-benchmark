# Serves the built React app inside the AdaLab container (see ../Containerfile).
# Replaces nginx's default server block; the port here must match the Containerfile's
# EXPOSE and `port` in ../.adalab/local_container_1.json.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Plotly bundle dominates the payload and compresses well.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints these, so they can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Results JSON is baked into the image under a stable name and changes on every
    # deploy, so it must be revalidated rather than cached.
    location /data/ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
