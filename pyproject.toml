[project]
name = "tsforecastbench"
version = "0.1.0"
description = "tsforecastbench - ML time series forecasting benchmark for water and environment"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "DHI Data Model Integration" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "matplotlib>=3.8",
    "requests>=2.31",
    "tqdm>=4.66",
    "statsforecast>=1.7",
    "mlforecast>=0.13",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "scikit-learn>=1.4",
    "utilsforecast>=0.2",
    "tomli>=2.0; python_version < '3.11'",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dl = ["torch>=2.2"]  # N-HiTS / PatchTST implemented directly on torch — portable (Win/Linux/CI)
# Full neuralforecast model zoo (TFT, TimesNet, iTransformer, Auto*). Pulls ray, which has
# no Windows / py3.13 wheels, so the dependency is marker-gated to Linux + py<3.13 (i.e. WSL).
# It stays out of the universal lock everywhere else; install on WSL with `uv sync --extra nf`.
nf = ["neuralforecast>=1.7; platform_system == 'Linux' and python_version < '3.13'"]
fm = ["chronos-forecasting>=2.0"]  # Chronos-Bolt; predict_quantiles(inputs=...) API
ms = ["modelskill>=1.0"]
data = ["requests>=2.31", "xarray>=2024.1", "netcdf4>=1.6", "utide>=0.3", "cdsapi>=0.7", "copernicusmarine>=1.3", "openpyxl>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "ipykernel>=6.29"]
notebooks = ["marimo>=0.9", "plotly>=5.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsforecastbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "UP036"]

[tool.ruff.lint.per-file-ignores]
# marimo cells display their last expression; a bare trailing name (e.g. a value
# chosen in an if/else above) is the idiomatic way to render it, not dead code.
"notebooks/*" = ["B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
