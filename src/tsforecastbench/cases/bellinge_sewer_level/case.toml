id = "bellinge_sewer_level"
domain = "urban_drainage"
notes = "Sewer water level at one level meter in the Bellinge combined drainage system (Odense, DK). Native sampling is 1-min; resampled to 15-min for the pilot. Rain gauge + X-band radar nowcast as exogenous."

target = "level_m"
target_unit = "m"

freq = "15min"
horizon_primary = "6h"
horizons_eval = ["1h", "6h", "24h"]
input_window = "7D"

exogenous = ["rain_gauge", "temp_air"]
exogenous_known_future = ["rain_radar_nowcast"]
static_attrs = ["catchment_area_ha", "impervious_frac"]
data_type = "observed"

[splits]
train_end = 2018-12-31
val_end = 2019-12-31
test_end = 2020-12-31

[source]
name = "Bellinge"
doi = "10.11583/DTU.c.5029124"
url = "https://essd.copernicus.org/articles/13/4779/2021/"
license = "CC-BY-4.0"
citation = "Nedergaard Pedersen et al. (2021) ESSD"
