id = "wwtp_influent_n2o_350k"
domain = "wastewater_treatment"
notes = "Influent flow rate at a 350,000 PE WWTP (Mendeley N2O dataset, 2 yrs, 2-min sampling resampled to hourly). Exogenous (rain at plant, temperature, control signals) to be added after inspecting columns via --list; starts univariate."

target = "influent_flow"
target_unit = "m3/h"

freq = "1h"
seasonalities = [12,24]
horizon_primary = "24h"
horizons_eval = ["6h", "24h"]

exogenous = []
exogenous_known_future = []
static_attrs = []
# NSE/KGE are hydrology-standard for flow/level; consider enabling them for this case once validated.

data_type = "observed"
split_mode = "fraction"
split_fraction = [0.7, 0.85]

[splits]
train_end = 2023-06-30
val_end = 2023-12-31
test_end = 2024-06-30

[source]
name = "Hansen et al. (2024) N2O WWTP"
doi = "10.17632/xmbxhscgpr.1"
url = "https://data.mendeley.com/datasets/xmbxhscgpr/1"
license = "CC BY 4.0"
citation = "Hansen et al. (2024). Time Series Dataset for Modeling and Forecasting of N2O in Wastewater Treatment. arXiv:2407.05959"
