id = "surge_cuxhaven"
domain = "storm_surge"
notes = "Hourly non-tidal residual (observed sea level minus tide prediction) at the Cuxhaven Steubenhoft GESLA gauge (German Bight). Exogenous: ERA5 mean sea-level pressure + 10-m wind components, fetched at the station point via Open-Meteo (credential-free). Wind and pressure are the physical surge drivers and are listed as known-future: at forecast time they would come from an NWP forecast; here the reanalysis is used as a perfect-forecast proxy. Record trimmed to 2000-2024 so ERA5 forcing covers the whole series. Necessary exogenous: mslp, u10, v10 (all three, per the driver statement above); no optional exogenous inputs."

target = "residual_m"
target_unit = "m"

freq = "1h"
seasonalities = [12,24]
horizon_primary = "48h"
horizons_eval = ["6h", "24h", "48h"]
input_window = "14D"

exogenous = ["mslp", "u10", "v10"]
exogenous_known_future = ["mslp", "u10", "v10"]
necessary_exogenous = ["mslp", "u10", "v10"]
static_attrs = ["lat", "lon"]
data_type = "mixed"
split_mode = "fraction"
split_fraction = [0.7, 0.85]

[splits]
train_end = 2017-02-15
val_end = 2020-10-17
test_end = 2024-06-19

[source]
name = "GESLA-3"
doi = "10.1002/gdj3.174"
url = "https://gesla787883612.wordpress.com/downloads/"
license = "Open, see GESLA terms"
citation = "Haigh et al. (2023) Geoscience Data Journal"
