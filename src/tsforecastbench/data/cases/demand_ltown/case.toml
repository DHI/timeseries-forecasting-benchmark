id = "demand_ltown"
domain = "water_distribution"
notes = "Inlet flow into the L-Town water distribution network (BattLeDIM 2020). Synthetic SCADA generated from EPANET simulations of a real Cyprus network, 2018 historical + 2019 evaluation. 5-min sampling resampled to hourly. Demand is strongly diurnal/weekly; calendar features dominate."

target = "inlet_flow"
target_unit = "L/s"

freq = "1h"
horizon_primary = "24h"
horizons_eval = ["6h", "24h", "168h"]
input_window = "14D"

exogenous = []
exogenous_known_future = []
static_attrs = []
data_type = "simulated"
split_mode = "calendar"

[splits]
train_end = 2018-09-30
val_end = 2018-12-31
test_end = 2019-12-31

[source]
name = "BattLeDIM L-Town"
doi = "10.5281/zenodo.4017659"
url = "https://battledim.ucy.ac.cy/"
license = "CC-BY-4.0"
citation = "Vrachimis et al. (2020) Battle of Leakage Detection and Isolation Methods"
