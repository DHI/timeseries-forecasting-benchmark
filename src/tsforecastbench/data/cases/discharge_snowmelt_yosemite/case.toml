id = "discharge_snowmelt_yosemite"
domain = "hydrology"
notes = "Daily snowmelt-dominated river discharge at the Merced River at Happy Isles, Yosemite CA (USGS 11264500). A third hydrology regime alongside groundwater-dominated discharge_lowland_denmark and flashy discharge_flashy_catskills: a smooth, strongly seasonal melt hydrograph driven by air temperature (snowmelt) more than by individual rain events. Tests whether method ranking holds across slow / flashy / snowmelt dynamics. Discharge cfs->m3/s; exogenous ERA5 air temperature (primary, melt) + precipitation (Open-Meteo)."

target = "discharge"
target_unit = "m3/s"

freq = "1D"
horizon_primary = "7D"
horizons_eval = ["1D", "3D", "7D"]
input_window = "30D"

exogenous = ["temp_air", "precip"]
exogenous_known_future = ["temp_air", "precip"]
static_attrs = ["lat", "lon"]
data_type = "mixed"

[splits]
train_end = 2018-12-31
val_end = 2019-12-31
test_end = 2020-12-31

[source]
name = "USGS NWIS 11264500"
url = "https://waterdata.usgs.gov/monitoring-location/11264500/"
license = "Public domain (US Geological Survey)"
citation = "U.S. Geological Survey National Water Information System"
